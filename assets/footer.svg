<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140" role="img" aria-label="Keep coding, keep growing">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#02267d"/>
      <stop offset="55%" stop-color="#1a0033"/>
      <stop offset="100%" stop-color="#E10026"/>
    </linearGradient>
    <style>
      .t { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-weight: 700; font-size: 30px; fill: #ffffff; text-anchor: middle; animation: glow 3s ease-in-out infinite; }
      .s { font-family: 'Courier New', monospace; font-weight: 700; font-size: 16px; fill: #ffd2d2; text-anchor: middle; letter-spacing: 4px; }
      @keyframes glow { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect width="1200" height="140" fill="url(#fg)"/>
  <text class="t" x="600" y="65">Keep Coding. Keep Growing. You've Got This! 🚀</text>
  <text class="s" x="600" y="105">CODING GURUJI  •  YOUR DAILY DOSE OF CODE &amp; MOTIVATION</text>
</svg>
