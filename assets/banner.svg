<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Coding Guruji - Your Daily Dose of Code and Motivation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E10026"/>
      <stop offset="42%" stop-color="#1a0033"/>
      <stop offset="100%" stop-color="#02267d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3030" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff3030" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { font-family: Georgia, 'Times New Roman', serif; font-weight: 900; font-size: 84px; fill: #ffffff; letter-spacing: 2px; }
      .tag { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-weight: 600; font-size: 28px; fill: #ffffff; }
      .sub { font-family: 'Courier New', monospace; font-weight: 700; font-size: 20px; fill: #ffd2d2; letter-spacing: 3px; }
      .sym { font-family: 'Courier New', monospace; font-weight: 700; fill: #ffffff; opacity: 0.18; }
      .float1 { animation: up 6s ease-in-out infinite; }
      .float2 { animation: up 8s ease-in-out infinite 1s; }
      .float3 { animation: up 7s ease-in-out infinite 2s; }
      .float4 { animation: up 9s ease-in-out infinite 0.5s; }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 1010px 160px; }
      .fade { animation: fade 1.6s ease-out both; }
      .fade2 { animation: fade 1.6s ease-out 0.5s both; }
      .fade3 { animation: fade 1.6s ease-out 1s both; }
      @keyframes up { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-18px); } }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.18); opacity: 1; } }
      @keyframes fade { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- floating code symbols -->
  <text class="sym float1" x="60" y="80" font-size="54">&lt;/&gt;</text>
  <text class="sym float2" x="190" y="280" font-size="46">{ }</text>
  <text class="sym float3" x="760" y="70" font-size="40">( )</text>
  <text class="sym float4" x="690" y="290" font-size="52">;</text>
  <text class="sym float1" x="1120" y="60" font-size="44">=&gt;</text>
  <text class="sym float2" x="1110" y="290" font-size="40">[ ]</text>

  <!-- title block -->
  <text class="title fade" x="70" y="150">Coding Guruji</text>
  <text class="tag fade2" x="74" y="205">Your Daily Dose of Code &amp; Motivation.</text>
  <text class="sub fade3" x="74" y="256">LEARN  •  BUILD  •  GROW  •  REPEAT</text>

  <!-- logo -->
  <circle class="pulse" cx="1010" cy="160" r="130" fill="url(#glow)"/>
  <circle cx="1010" cy="160" r="95" fill="#000000"/>
  <path d="M1068 112 A66 66 0 1 0 1068 208" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <text x="1010" y="196" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="116" fill="#ff3030">G</text>
</svg>
